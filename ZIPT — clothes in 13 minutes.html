<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZIPT — clothes in 13 minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF7;--fg:#0E0E0E;--mute:#8a8a84;--soft:#efefe9;--lime:#C6FF3D;--glass:rgba(250,250,247,.72);--r:24px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E0E;--fg:#FAFAF7;--mute:#8d8d86;--soft:#1a1a18;--glass:rgba(14,14,14,.72)}}
:root[data-theme="dark"]{--bg:#0E0E0E;--fg:#FAFAF7;--mute:#8d8d86;--soft:#1a1a18;--glass:rgba(14,14,14,.72)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 Inter,system-ui,sans-serif;letter-spacing:-.01em;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.03em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.logo{font-size:30px;line-height:1}
.eta{display:inline-flex;gap:8px;align-items:center;background:var(--lime);color:#0E0E0E;padding:7px 14px;border-radius:99px;font-weight:500;font-size:13px}
.eta i{width:7px;height:7px;border-radius:50%;background:#0E0E0E;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.2}}
.nav-r{display:flex;gap:6px;align-items:center}
.ib{padding:8px 12px;border-radius:99px;background:var(--soft);font-size:13px}
.hero{padding:7vh 20px 4vh;max-width:1200px;margin:auto;position:relative}
.hero h1{font-size:clamp(64px,17vw,220px);line-height:.88}
.hero h1 span{display:block;overflow:hidden}
.hero h1 b{display:block;font-weight:400;transform:translateY(105%);animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2) b{animation-delay:.12s;font-style:italic}
.hero h1 span:nth-child(3) b{animation-delay:.24s}
@keyframes up{to{transform:none}}
.hero-foot{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-top:5vh;flex-wrap:wrap}
.hero p{max-width:30ch;color:var(--mute)}
.clock{font-size:clamp(48px,9vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.marquee{overflow:hidden;white-space:nowrap;background:var(--fg);color:var(--bg);padding:14px 0;margin:4vh 0}
.marquee div{display:inline-block;animation:mq 22s linear infinite;font-size:22px}
@keyframes mq{to{transform:translateX(-50%)}}
.rail{display:flex;gap:8px;padding:0 20px;overflow-x:auto;max-width:1200px;margin:auto;scrollbar-width:none}
.chip{padding:10px 18px;border-radius:99px;background:var(--soft);white-space:nowrap;transition:.25s}
.chip[aria-pressed=true]{background:var(--lime);color:#0E0E0E}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px;padding:28px 20px 80px;max-width:1200px;margin:auto}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:40px 20px}}
.card{opacity:0;transform:translateY(24px);animation:up2 .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up2{to{opacity:1;transform:none}}
.img{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;cursor:pointer}
.img .l{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .6s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.img .l svg{width:62%}
.img .l2{opacity:0}
.img:hover .l2{opacity:1}.img:hover .l{transform:scale(1.05)}
.badge{position:absolute;left:12px;top:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--fg)}
.add{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--lime);color:#0E0E0E;font-size:24px;line-height:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1);z-index:2}
.meta{display:flex;justify-content:space-between;gap:8px;padding:12px 4px 0}
.meta h3{font-weight:500;font-size:15px}.meta small{color:var(--mute)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:12px;top:12px;bottom:12px;width:min(420px,calc(100% - 24px));background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-radius:var(--r);padding:24px;z-index:50;display:flex;flex-direction:column;transform:translateX(120%);transition:transform .6s cubic-bezier(.2,1.1,.3,1)}
.drawer.on{transform:none}
.sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);background:var(--bg);border-radius:var(--r) var(--r) 0 0;padding:12px 24px calc(28px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.2,1,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--mute);margin:0 auto 18px;opacity:.5}
.sizes{display:flex;gap:10px;margin:18px 0}
.sz{flex:1;padding:14px 0;border-radius:16px;background:var(--soft);position:relative}
.sz[disabled]{opacity:.3;cursor:not-allowed}
.sz:not([disabled]):hover{background:var(--lime);color:#0E0E0E}
.sz u{position:absolute;right:8px;top:8px;width:5px;height:5px;border-radius:50%;background:#f5a524;text-decoration:none}
.btn{width:100%;padding:16px;border-radius:99px;background:var(--lime);color:#0E0E0E;font-weight:500}
.btn.dark{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0}
.thumb{width:56px;height:70px;border-radius:14px;display:grid;place-items:center;flex:none}
.thumb svg{width:70%}
.list{flex:1;overflow:auto}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:var(--mute)}
.tog button{width:44px;height:26px;border-radius:99px;background:var(--soft);position:relative;transition:.3s}
.tog button::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:.3s}
.tog button[aria-pressed=true]{background:var(--lime)}.tog button[aria-pressed=true]::after{left:21px;background:#0E0E0E}
.track{position:fixed;inset:0;background:var(--bg);z-index:80;padding:28px 20px;display:none;flex-direction:column;gap:24px;max-width:700px;margin:auto}
.track.on{display:flex}
.map{flex:1;min-height:220px;background:var(--soft);border-radius:var(--r);position:relative;overflow:hidden}
.map svg{width:100%;height:100%}
.steps{display:flex;gap:8px}
.st{flex:1;padding-top:10px;border-top:3px solid var(--soft);color:var(--mute);transition:.5s}
.st.on{border-color:var(--lime);color:var(--fg)}
#cur{position:fixed;left:0;top:0;pointer-events:none;z-index:99;width:10px;height:10px;border-radius:50%;background:var(--fg);mix-blend-mode:difference;display:none;transition:width .25s,height .25s,margin .25s}
#cur.big{width:78px;height:78px;margin:-34px 0 0 -34px;background:var(--lime);mix-blend-mode:normal;display:grid;place-items:center;color:#0E0E0E;font-size:13px;font-weight:500}
@media(pointer:fine){#cur{display:block}.img,.add{cursor:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="cur"></div>
<nav>
  <div class="logo serif">zipt</div>
  <div class="eta"><i></i>13 min to 452001</div>
  <div class="nav-r"><button class="ib" id="th" aria-label="Toggle theme">Theme</button><button class="ib" id="cb">Bag (<span id="cn">0</span>)</button></div>
</nav>

<header class="hero">
  <h1 class="serif"><span><b>Dressed</b></span><span><b>in thirteen</b></span><span><b>minutes.</b></span></h1>
  <div class="hero-foot">
    <p>Pick it, try it at your door, keep what fits. Free returns on the spot.</p>
    <div class="clock serif" id="clk">13:00</div>
  </div>
</header>

<div class="marquee"><div class="serif" id="mq"></div></div>

<div class="rail" id="rail" role="group" aria-label="Categories"></div>
<main class="grid" id="grid"></main>

<div class="scrim" id="sc"></div>

<aside class="drawer" id="dr" aria-label="Your bag">
  <div class="row" style="justify-content:space-between;padding-top:0"><h2 class="serif" style="font-size:34px">Your bag</h2><button class="ib" id="dx">Close</button></div>
  <div class="list" id="ci"></div>
  <div class="tog"><span>Try at door</span><button id="try" aria-pressed="true" aria-label="Try at door"></button></div>
  <div class="row" style="justify-content:space-between"><span>Total</span><b id="tot" style="font-weight:500">₹0</b></div>
  <button class="btn" id="pay">Pay with UPI</button>
</aside>

<div class="sheet" id="sh" role="dialog" aria-label="Pick a size">
  <div class="grab"></div>
  <h3 class="serif" id="shn" style="font-size:32px"></h3>
  <small style="color:var(--mute)">Pick a size. Dots mean low stock.</small>
  <div class="sizes" id="szs"></div>
</div>

<section class="track" id="tk" aria-label="Order tracking">
  <div style="display:flex;justify-content:space-between;align-items:start">
    <div><div class="serif" style="font-size:64px;line-height:1" id="tc">13:00</div><span style="color:var(--mute)" id="ts">Packing your order</span></div>
    <button class="ib" id="tx">Done</button>
  </div>
  <div class="map">
    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
      <path id="rt" d="M40 250 C120 250 100 150 190 150 S300 60 350 50" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
      <circle cx="40" cy="250" r="7" fill="currentColor"/>
      <circle cx="350" cy="50" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle id="rd" r="11" fill="#C6FF3D"/>
    </svg>
  </div>
  <div class="steps"><div class="st on" id="s0">Packed</div><div class="st" id="s1">Picked up</div><div class="st" id="s2">Arriving</div></div>
</section>

<script>
const $=s=>document.querySelector(s);
const G={
tee:"M30 22L42 18Q50 26 58 18L70 22L90 40L80 52L72 46V108H28V46L20 52L10 40Z",
jeans:"M32 14H68L72 112H54L50 52L46 112H28Z",
kurta:"M32 16L42 12Q50 20 58 12L68 16L84 34L76 44L70 40L74 116H26L30 40L24 44L16 34Z",
coat:"M28 20L42 14L50 30L58 14L72 20L92 44L82 58L74 50V114H26V50L18 58L8 44Z",
shoe:"M10 82Q10 62 30 60L40 70L58 64Q86 66 92 86V96H10Z"};
const P=[
{n:"Boxy tee",c:"Tees",p:699,g:"tee",bg:["#E8E4DA","#D9E3EA"],f:["#0E0E0E","#F4F1EA"],lo:0},
{n:"Straight denim",c:"Denim",p:1799,g:"jeans",bg:["#DDE3EA","#E9E6DF"],f:["#3B5170","#1B2A40"],lo:1},
{n:"Chikankari kurta",c:"Ethnic",p:1499,g:"kurta",bg:["#EFE6D8","#E4EBDD"],f:["#FBF7EE","#C9D8C0"],lo:0},
{n:"Quilted jacket",c:"Winter",p:2999,g:"coat",bg:["#D9DDD2","#E6DFD8"],f:["#4F5B45","#2C2A28"],lo:1},
{n:"Court sneaker",c:"Footwear",p:2499,g:"shoe",bg:["#EAEAE6","#E0E4E8"],f:["#FFFFFF","#C6FF3D"],lo:0},
{n:"Washed tee",c:"Tees",p:799,g:"tee",bg:["#E6DDD6","#DDE6DD"],f:["#B8795A","#7C9A7C"],lo:1},
{n:"Baggy denim",c:"Denim",p:1999,g:"jeans",bg:["#E3E1DC","#D8DEE6"],f:["#8FA3BD","#14171C"],lo:0},
{n:"Bandhgala kurta",c:"Ethnic",p:1899,g:"kurta",bg:["#E9DFE0","#E6E3D2"],f:["#7A2E3A","#1F3A2E"],lo:1},
{n:"Puffer vest",c:"Winter",p:2299,g:"coat",bg:["#E0E3E8","#E8E2D8"],f:["#C6FF3D","#0E0E0E"],lo:0},
{n:"Slide sandal",c:"Footwear",p:999,g:"shoe",bg:["#E8E0D4","#DCE4E4"],f:["#2B2B2B","#E7D9C3"],lo:1}];
const svg=(g,f)=>`<svg viewBox="0 0 100 125" aria-hidden="true"><path d="${G[g]}" fill="${f}"/></svg>`;
const cats=["All",...new Set(P.map(p=>p.c))];
let cat="All",cart=[],sel=null;
try{cart=JSON.parse(localStorage.getItem("zipt-cart")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("zipt-cart",JSON.stringify(cart))}catch(e){}};
$("#mq").textContent=("13 min · Try at door · Free returns · ").repeat(12);

function rail(){$("#rail").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c==cat}" data-c="${c}">${c}</button>`).join("")}
function grid(){
 $("#grid").innerHTML=P.map((p,i)=>({p,i})).filter(o=>cat=="All"||o.p.c==cat).map(({p,i},k)=>`
 <article class="card" style="animation-delay:${k*70}ms">
  <div class="img" data-i="${i}" data-cur="View">
   <div class="l" style="background:${p.bg[0]}">${svg(p.g,p.f[0])}</div>
   <div class="l l2" style="background:${p.bg[1]}">${svg(p.g,p.f[1])}</div>
   <span class="badge">${6+(i*3)%7} min</span>
   <button class="add" data-i="${i}" aria-label="Add ${p.n}">+</button>
  </div>
  <div class="meta"><div><h3>${p.n}</h3><small>${p.c}</small></div><span>₹${p.p}</span></div>
 </article>`).join("");
}
$("#rail").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;rail();grid()};
$("#grid").onclick=e=>{const b=e.target.closest(".img");if(b)openSheet(+b.dataset.i)};

function openSheet(i){
 sel=i;const p=P[i];$("#shn").textContent=p.n;
 $("#szs").innerHTML=["S","M","L","XL"].map((s,k)=>{const out=p.lo&&k==3,low=p.lo&&k==2;return`<button class="sz" data-s="${s}" ${out?"disabled":""}>${s}${low?"<u></u>":""}</button>`}).join("");
 $("#sh").classList.add("on");$("#sc").classList.add("on");
}
$("#szs").onclick=e=>{const b=e.target.closest(".sz");if(!b||b.disabled)return;
 const ex=cart.find(x=>x.i==sel&&x.s==b.dataset.s);ex?ex.q++:cart.push({i:sel,s:b.dataset.s,q:1});
 save();closeAll();renderCart();bump();setTimeout(()=>$("#dr").classList.add("on")||$("#sc").classList.add("on"),250)};
function bump(){const c=$("#cb");c.animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:420,easing:"cubic-bezier(.3,1.6,.5,1)"})}
function closeAll(){["#sh","#dr"].forEach(s=>$(s).classList.remove("on"));$("#sc").classList.remove("on")}
$("#sc").onclick=closeAll;$("#dx").onclick=closeAll;
$("#cb").onclick=()=>{renderCart();$("#dr").classList.add("on");$("#sc").classList.add("on")};
function renderCart(){
 $("#cn").textContent=cart.reduce((a,x)=>a+x.q,0);
 $("#ci").innerHTML=cart.length?cart.map((x,k)=>{const p=P[x.i];return`<div class="row"><div class="thumb" style="background:${p.bg[0]}">${svg(p.g,p.f[0])}</div><div style="flex:1"><div>${p.n}</div><small style="color:var(--mute)">Size ${x.s} · ₹${p.p}</small></div><button class="ib" data-k="${k}" data-d="-1">−</button><span>${x.q}</span><button class="ib" data-k="${k}" data-d="1">+</button></div>`}).join(""):`<p style="color:var(--mute);padding:20px 0">Your bag is empty. Tap + on any piece to add it.</p>`;
 $("#tot").textContent="₹"+cart.reduce((a,x)=>a+x.q*P[x.i].p,0);
 $("#pay").disabled=!cart.length;
}
$("#ci").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const x=cart[+b.dataset.k];x.q+=+b.dataset.d;if(x.q<1)cart.splice(+b.dataset.k,1);save();renderCart()};
$("#try").onclick=e=>e.currentTarget.setAttribute("aria-pressed",e.currentTarget.getAttribute("aria-pressed")!="true");

// order tracking (1 real second = 13 simulated seconds)
let tm;
$("#pay").onclick=()=>{closeAll();cart=[];save();renderCart();$("#tk").classList.add("on");
 const path=$("#rt"),len=path.getTotalLength(),rd=$("#rd"),t0=performance.now(),dur=60000;
 ["s0","s1","s2"].forEach((s,k)=>$("#"+s).classList.toggle("on",k==0));
 cancelAnimationFrame(tm);
 (function f(now){const t=Math.min((now-t0)/dur,1),left=Math.ceil(780*(1-t));
  $("#tc").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
  const stage=t<.2?0:t<.8?1:2;["s0","s1","s2"].forEach((s,k)=>$("#"+s).classList.toggle("on",k<=stage));
  $("#ts").textContent=["Packing your order","Rider is on the way","Arriving at your door"][stage];
  const mv=Math.max(0,(t-.2)/.8),pt=path.getPointAtLength(len*mv);rd.setAttribute("cx",pt.x);rd.setAttribute("cy",pt.y);
  if(t<1)tm=requestAnimationFrame(f);else $("#ts").textContent="Delivered. Try it on."})(t0)};
$("#tx").onclick=()=>{cancelAnimationFrame(tm);$("#tk").classList.remove("on")};

// hero countdown loop
let s=780;setInterval(()=>{s=s<=0?780:s-1;$("#clk").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000);

// theme
$("#th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#0E0E0E";r.dataset.theme=d?"light":"dark"};

// cursor + magnetic add button
const cur=$("#cur");let cx=0,cy=0,tx=0,ty=0;
addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY;
 const im=e.target.closest(".img"),ad=e.target.closest(".add");
 if(im){cur.classList.add("big");cur.textContent=ad?"Add":"View"}else{cur.classList.remove("big");cur.textContent=""}
 document.querySelectorAll(".add").forEach(b=>{const r=b.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  b.style.transform=Math.hypot(dx,dy)<90?`translate(${dx*.25}px,${dy*.25}px) scale(1.1)`:""})});
(function m(){cx+=(tx-cx)*.22;cy+=(ty-cy)*.22;cur.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(m)})();
$("#grid").addEventListener("click",e=>{const a=e.target.closest(".add");if(a){e.stopPropagation();openSheet(+a.dataset.i)}},true);

rail();grid();renderCart();
</script>
</body>
</html>
